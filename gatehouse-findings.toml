# Gatehouse findings judged by a person or a seat, with the reason.

[[findings]]
agent = "security"
category = "security"
file = "install/wifi.ks.example"
evidence = "SSID=$(cat <<'__WIFI_KS_SSID_END__'\n@SSID@\n__WIFI_KS_SSID_END__\n)\nPSK=$(cat <<'__WIFI_KS_PSK_END__'\n@PSK@\n__WIFI_KS_PSK_END__\n)"
status = "not-a-bug"
reason = "A WPA passphrase is 8-63 printable ASCII characters and cannot hold a newline, and the values are typed by the operator into a local copy of a kickstart whose %pre and %post they already write as root. An SSID with an embedded newline followed by the delimiter is not an input this template meets; quotes and $ are, and the heredocs handle those."
