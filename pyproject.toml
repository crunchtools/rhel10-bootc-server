# The release's version, which sdlc's write job requires a pyproject.toml to
# state. A release moves it with VERSION.
[project]
name = "rhel10-bootc-server"
version = "1.8.2"

[tool.sdlc]
repo-kinds = ["bootc-image"]
# This file exists for ruff and for sdlc, not for a package: tests/*.py are
# scripts, linted by the ruff-check hook. Without this, a pyproject.toml makes
# sdlc run the python stack instead of the bootc one.
skip-stacks = ["python"]

# The image needs RHSM and registry.redhat.io secrets, which a pull request's
# check does not hold: the image job builds, lints and scans it at merge.
[tool.sdlc.ci]
checks = ["signing-key", "digest-gate"]
skip = ["container-build", "bootc-lint", "container-scan"]

# The shipped public key must be a valid ECDSA P-256 key (#44); hosts verify
# every pull against it.
[tool.sdlc.ci.signing-key]
kind = "command"
argv = ["python3", "tests/signing-key.py"]

# disk.yml's pull-request job: its signature boundary refuses malformed and
# unsigned digests and passes a signed one, against a loopback fixture (#76).
[tool.sdlc.ci.digest-gate]
kind = "command"
argv = ["bash", "tests/digest-gate.sh"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/rhel10-bootc-server"
format = "oci"
free-disk = true
redhat-registry = true
rhsm = true
# The boot gate for this image is `bootc container lint`: the bootc stack's
# bootc-lint gate runs it on the built image before it is pushed, and
# boot = "command" is not enforced (crunchtools/sdlc#118).
boot = "none"
boot-none-reason = "a bootc host: PID 1 is systemd; the bootc-lint gate judges the image"

[tool.ruff]
line-length = 100
# The Python the sdlc image runs tests/*.py with, and the ruff hook's rev
# matches the version that image bakes.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "PIE", "PT",
          "RET", "SIM", "TID", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]

# Gourmand's IF001 requires explicit thresholds, matched to the fleet's.
[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10
