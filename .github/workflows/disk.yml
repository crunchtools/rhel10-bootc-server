# Raw disk for hosts that cannot install from the registry (RT#1638). Linode
# boots a raw disk with direct-disk, and `bootc install to-existing-root` fails
# there because Linode disks carry no partition table; a bootc-image-builder raw
# written onto a raw Linode disk is the route that works. It cannot go in as a
# Linode image: the raw is 10 GiB and Linode caps an image at 6 GiB, so stream
# it onto the disk from a throwaway helper disk (hosts/lotor/README.md).
# Dispatched with the digest to install, and only from main or a v* tag: the
# root key comes from the checked-out install/root-authorized-keys, so a run on
# any other ref could ship someone else's key under the artifact name an
# operator downloads. The digest gate's self-test runs in `sdlc ci` (sdlc.toml,
# digest-gate), on every pull request.
#
# The source digest must carry the bootc signature, or nothing is built: a disk
# is a host, and it should start from what a host would accept as an update.
# The disk boots pinned to that digest. After first boot, run `bootc switch`
# to :latest; the host's shipped policy verifies that pull. No cloud token comes near this workflow; whoever
# dispatches it downloads the artifact and uploads it to the provider.
name: Disk image

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "sha256:... of quay.io/crunchtools/rhel10-bootc-server to install"
        required: true
        type: string

permissions: {}

concurrency:
  group: disk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disk:
    name: raw disk
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # GitHub-hosted only: osbuild needs real root, and a runner that maps only
    # uid 0 into a user namespace fails every chown in the build root.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      REPO: quay.io/crunchtools/rhel10-bootc-server
      DIGEST: ${{ inputs.digest }}
      # Pinned by digest: the builder runs privileged. cosign is pinned the same
      # way container.yml pins it.
      BIB: quay.io/centos-bootc/bootc-image-builder@sha256:dab86ee6b46dcade411b37f4e70b07d93b6a06da0dbfec6fe89247a220e0d9f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cosign v2.6.5
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  $RUNNER_TEMP/cosign" | sha256sum -c
          sudo install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
      - name: The source digest is signed by the bootc key
        run: |
          set -euo pipefail
          IMAGE=$(tests/digest-gate.sh "$REPO" "$DIGEST" etc/pki/sigstore/crunchtools-bootc.pub)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Build the raw disk
        run: |
          set -euo pipefail
          # Quay drops a blob mid-read now and then on an image this size.
          for try in 1 2 3; do
            sudo podman pull "$IMAGE" && break
            [ "$try" = 3 ] && exit 1
            sleep 20
          done
          mkdir -p output
          key=$(grep -m1 '^ssh-' install/root-authorized-keys)
          printf '[[customizations.user]]\nname = "root"\nkey = "%s"\n' "$key" > config.toml
          # Ubuntu 24.04 runners confine unprivileged user namespaces with
          # AppArmor, which breaks osbuild's sandbox even in a privileged root
          # container (EPERM on fchownat, mount of containers/storage denied).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t --security-opt apparmor=unconfined \
            -v ./config.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" build --type raw --rootfs xfs "$IMAGE"
          sudo gzip -1 output/image/disk.raw
          cd output/image
          echo "$IMAGE" | sudo tee SOURCE
          sudo sha256sum disk.raw.gz | sudo tee SHA256SUM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rhel10-bootc-server-raw
          path: output/image/
          retention-days: 7
          compression-level: 0
