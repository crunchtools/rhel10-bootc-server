# Raw disk for hosts that cannot install from the registry (RT#1638). Linode
# boots a raw disk with direct-disk, and `bootc install to-existing-root` fails
# there because Linode disks carry no partition table; a bootc-image-builder raw
# uploaded as a Linode image is the route that works. Dispatched with the digest
# to install. A pull request that changes this file builds from `latest`, so the
# build is proven before a merge rather than at the first dispatch.
#
# The source digest must carry the bootc signature, or nothing is built: a disk
# is a host, and it should start from what a host would accept as an update.
# The disk tracks :latest, so its first `bootc upgrade` is checked against the
# policy the image ships. No cloud token comes near this workflow; whoever
# dispatches it downloads the artifact and uploads it to the provider.
name: Disk image

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "sha256:... of quay.io/crunchtools/rhel10-bootc-server to install"
        required: true
        type: string
  pull_request:
    paths: ['.github/workflows/disk.yml', 'install/root-authorized-keys']

permissions: {}

concurrency:
  group: disk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disk:
    name: raw disk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      REPO: quay.io/crunchtools/rhel10-bootc-server
      DIGEST: ${{ inputs.digest }}
      # Pinned by digest: the builder runs privileged. cosign is pinned the same
      # way container.yml pins it.
      BIB: quay.io/centos-bootc/bootc-image-builder@sha256:dab86ee6b46dcade411b37f4e70b07d93b6a06da0dbfec6fe89247a220e0d9f8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cosign v2.6.5
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  $RUNNER_TEMP/cosign" | sha256sum -c
          sudo install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
      - name: Resolve the source digest
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            DIGEST=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://$REPO:latest")
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::not a sha256 digest: $DIGEST" >&2; exit 1; }
          echo "IMAGE=$REPO@$DIGEST" >> "$GITHUB_ENV"
      - name: The source digest is signed by the bootc key
        run: cosign verify --insecure-ignore-tlog --key etc/pki/sigstore/crunchtools-bootc.pub "$IMAGE"
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Build the raw disk
        run: |
          set -euo pipefail
          # Quay drops a blob mid-read now and then on an image this size.
          for try in 1 2 3; do
            sudo podman pull "$IMAGE" && break
            [ "$try" = 3 ] && exit 1
            sleep 20
          done
          mkdir -p output
          key=$(grep -m1 '^ssh-' install/root-authorized-keys)
          printf '[[customizations.user]]\nname = "root"\nkey = "%s"\n' "$key" > config.toml
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t \
            -v ./config.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" --type raw --rootfs xfs --target-imgref "$REPO:latest" "$IMAGE"
          sudo gzip -1 output/image/disk.raw
          cd output/image
          echo "$IMAGE" | sudo tee SOURCE
          sudo sha256sum disk.raw.gz | sudo tee SHA256SUM
      - uses: actions/upload-artifact@v7
        with:
          name: rhel10-bootc-server-raw
          path: output/image/
          retention-days: 7
          compression-level: 0
