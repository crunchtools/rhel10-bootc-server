# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). Quay.io only.
#
# A bootc host image: built as a plain OCI manifest, gated by
# `bootc container lint` against the pushed digest. Hosts follow the tag they
# were switched to with `bootc switch`; :main moves on merge, :latest on v*.

name: Container

on:
  pull_request:
    paths: ['Containerfile', 'etc/**', '.github/workflows/container.yml']
  push:
    branches: [main]
    tags: ["v*"]
    paths: ['Containerfile', 'etc/**', '.github/workflows/container.yml']
  schedule:
    - cron: "47 5 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.41.0
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/rhel10-bootc-server
      format: oci
      free-disk: true
      redhat-registry: true
      rhsm: true
      boot: command
      boot-command: podman run --rm "$IMAGE" bootc container lint
      boot-timeout: 600
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      REGISTRY_REDHAT_IO_USER: ${{ secrets.REGISTRY_REDHAT_IO_USER }}
      REGISTRY_REDHAT_IO_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
      RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
      RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}

  # Sign what was promoted (#44). Hosts refuse a quay.io/crunchtools/rhel10-bootc-*
  # image this key did not sign, so a stolen Quay token can move a tag but cannot
  # make a host boot what it points at. Only promoted digests are signed -- a
  # merge to main, a v* release, the weekly rebuild -- never a pull request's
  # candidate, so a pushed branch cannot produce an image a host would accept.
  # A pull request still proves the key: the secret must be the private half of
  # the public key the image ships, or a release would sign with a key no host
  # trusts. cosign v2: v3 stores signatures as OCI referrers, which c/image (and
  # so bootc) does not read; c/image does not check Rekor, so neither do we.
  sign:
    name: sign
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cosign v2.6.5
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  $RUNNER_TEMP/cosign" | sha256sum -c
          sudo install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
      - name: Sign the promoted digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          IMAGE: quay.io/crunchtools/rhel10-bootc-server
          DIGEST: ${{ needs.container.outputs.digest }}
          PUB: etc/pki/sigstore/crunchtools-bootc.pub
        run: |
          set -eu
          if [ -z "$QUAY_USERNAME" ]; then
            echo "::notice::no secrets in this run (Dependabot or a fork); nothing was pushed, nothing to sign"
            exit 0
          fi
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "::error::COSIGN_PRIVATE_KEY is not set: a promoted image would ship unsigned and hosts would refuse it" >&2; exit 1; }
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/secret.pub"
          cmp -s "$RUNNER_TEMP/secret.pub" "$PUB" || { echo "::error::COSIGN_PRIVATE_KEY is not the private half of $PUB" >&2; exit 1; }
          if [ -z "$DIGEST" ]; then
            echo "::notice::not promoted; the signing key matches $PUB, nothing signed"
            exit 0
          fi
          printf '%s' "$QUAY_PASSWORD" | cosign login quay.io -u "$QUAY_USERNAME" --password-stdin
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify --insecure-ignore-tlog --key "$PUB" "$IMAGE@$DIGEST"
          echo "::notice::signed $IMAGE@$DIGEST"
