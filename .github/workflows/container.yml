# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). Quay.io only.
#
# A bootc host image: built as a plain OCI manifest, gated by
# `bootc container lint` against the pushed digest. Hosts follow the tag they
# were switched to with `bootc switch`; :main moves on merge, :latest on v*.
#
# No `paths:` filter, matching examples/container.yml and the rest of the
# fleet. One skipped the release commit, which touches only VERSION and
# CHANGELOG.md: that commit then carried no gated- tag, so `resolve` found
# nothing and the v* run rebuilt from scratch instead of promoting the bytes
# the pull request had already gated. A filter here costs build-once.

name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "47 5 * * 0"   # weekly, early Sunday: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.56.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/rhel10-bootc-server
      format: oci
      # The Containerfile never COPYs these, so a release PR reuses the gated digest.
      outside-image: VERSION CHANGELOG.md
      free-disk: true
      redhat-registry: true
      rhsm: true
      boot: command
      # The mt76 overlay (RT#1656): modprobe in the built image must resolve
      # mt7925e to updates/, not the stock driver.
      boot-command: |
        podman run --rm "$IMAGE" bootc container lint
        podman run --rm "$IMAGE" sh -c 'modinfo -k "$(ls /usr/lib/modules)" mt7925e mt76' | tee modinfo.txt
        grep -q '^filename: *.*/updates/mt76/mt7925/mt7925e.ko$' modinfo.txt
        grep -q '^filename: *.*/updates/mt76/mt76.ko$' modinfo.txt
      boot-timeout: 600
      # Promote signs the digest before any tag moves (#47), so a tag never
      # points at an image hosts would refuse, and a pull request's candidate is
      # never signed. The key is the cosign-signing environment's (main and v*
      # only); it verifies against the constitution's keys/crunchtools-bootc.pub,
      # which must match etc/pki/sigstore/crunchtools-bootc.pub here. Key loss
      # and rotation: docs/signing-key.md.
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      REGISTRY_REDHAT_IO_USER: ${{ secrets.REGISTRY_REDHAT_IO_USER }}
      REGISTRY_REDHAT_IO_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
      RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
      RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  # The shipped public key must parse (#44). This needs no secret, so it runs on
  # every pull request, Dependabot's included; the signing key itself never
  # reaches a pull request run.
  signing-key:
    name: signing key
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The shipped public key is an ECDSA P-256 key
        env:
          PUB: etc/pki/sigstore/crunchtools-bootc.pub
        run: |
          set -euo pipefail
          openssl pkey -pubin -in "$PUB" -noout -text | grep -q 'NIST CURVE: P-256' \
            || { echo "::error::$PUB is not an ECDSA P-256 public key" >&2; exit 1; }
