# One-time signature backfill (#47, #64): signs each digest in
# signing/backfill.txt with the fleet key, so hosts that trust only signed
# quay.io/crunchtools images do not refuse what they already run or would roll
# back to. Promote signs every new digest; this covers the ones it never will.
#
# Runs only on main, in the cosign-signing environment (main and v* only), and
# only on a push that changed the list or a manual run, so the key signs
# nothing a reviewed merge did not name. Idempotent: a digest that already
# verifies is skipped. Same cosign, key check and flags as the constitution's
# container-release.yml promote.

name: Backfill signatures

on:
  push:
    branches: [main]
    paths: ['signing/backfill.txt']
  workflow_dispatch:

permissions: {}

concurrency:
  group: sign-backfill
  cancel-in-progress: false

jobs:
  sign:
    name: sign backfill
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cosign-signing
    permissions:
      contents: read
    steps:
      - name: Keep registry auth inside this job
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cosign v2: v3 stores signatures as OCI referrers, which c/image cannot read.
      - name: Install cosign v2.6.5
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  $RUNNER_TEMP/cosign" | sha256sum -c
          install -D -m 0755 "$RUNNER_TEMP/cosign" "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Sign each listed digest once
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          PUB: etc/pki/sigstore/crunchtools-bootc.pub
          LIST: signing/backfill.txt
        run: |
          set -euo pipefail
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "::error::no COSIGN_PRIVATE_KEY in the cosign-signing environment" >&2; exit 1; }
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/secret.pub"
          cmp -s "$RUNNER_TEMP/secret.pub" "$PUB" || { echo "::error::COSIGN_PRIVATE_KEY is not the private half of $PUB" >&2; exit 1; }
          # Every line is checked before anything is signed: one bad line signs nothing.
          refs=()
          while IFS= read -r line; do
            ref="${line%%#*}"; ref="${ref//[[:space:]]/}"
            [ -n "$ref" ] || continue
            [[ "$ref" =~ ^quay\.io/crunchtools/[a-z0-9][a-z0-9._-]*@sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::$LIST: not a quay.io/crunchtools digest reference: $ref" >&2; exit 1; }
            refs+=("$ref")
          done < "$LIST"
          printf '%s' "$QUAY_PASSWORD" | cosign login quay.io -u "$QUAY_USERNAME" --password-stdin
          signed=0 skipped=0
          for ref in "${refs[@]}"; do
            if cosign verify --insecure-ignore-tlog --key "$PUB" "$ref" >/dev/null 2>&1; then
              skipped=$((skipped + 1))
              continue
            fi
            cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$ref"
            cosign verify --insecure-ignore-tlog --key "$PUB" "$ref" >/dev/null
            echo "::notice::signed $ref"
            signed=$((signed + 1))
          done
          echo "### Backfill: $signed signed, $skipped already signed, ${#refs[@]} listed" >> "$GITHUB_STEP_SUMMARY"
      - name: Drop registry auth
        if: always()
        run: rm -rf "$RUNNER_TEMP/docker"
