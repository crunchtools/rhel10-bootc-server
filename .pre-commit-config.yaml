# Every check runs from quay.io/crunchtools/sdlc (constitution XII). Nothing
# here pins it: .sdlc/bin/sdlc asks the image for its own launcher and runs it,
# so the launcher, the image and every tool inside it float together on
# :latest -- for this laptop and, through .github/workflows/ci.yml, for CI.
# There is no `rev:` to bump, ever.
#
#   SDLC_IMAGE=main git push   judges this push with what has merged to
#                              python-sdlc and not been released. A repo opts
#                              its CI in with the repository variable SDLC_IMAGE.
#
# What each hook runs is configured in pyproject.toml ([tool.sdlc.commit],
# [tool.sdlc.push], [tool.sdlc.ci]). `.sdlc/bin/sdlc tiers` prints it.
#
# `default_install_hook_types` must name every stage: without pre-push,
# `pre-commit install` wires only the commit hook and every verdict silently
# stops running; without pre-merge-commit, a merge skips ruff.

default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]

repos:
  # sdlc skips its python stack here (pyproject.toml), so ruff runs from its own
  # hook, at the version the sdlc image bakes. Gourmand's IF001 requires it.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit, pre-merge-commit]

  - repo: local
    hooks:
      - id: sdlc-commit
        name: sdlc commit
        entry: .sdlc/bin/sdlc commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
      - id: sdlc-push
        name: sdlc push
        entry: .sdlc/bin/sdlc push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
