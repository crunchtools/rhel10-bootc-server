#############################################################################
# lotor — host log forwarder
#
# This file REPLACES the stock RHEL rsyslog.conf wholesale, and the reason is
# the first module line below.
#
# rsyslog here is a forwarder only. It writes no local log files: journald
# keeps the local buffer (Storage=persistent, capped by journald.conf.d), and
# the central collector owns the long-term plain-text corpus.
#
# WHY NOT imjournal
#
# The stock RHEL config reads the journal with imjournal, which opens
# journald's binary files and keeps a cursor into them. After a journal
# rotation it silently stops following. rsyslog stays alive, the network
# inputs keep working, and every imjournal counter still reads zero --
# discarded: 0, failed: 0, poll_failed: 0, recovery_attempts: 0 -- because
# from its point of view nothing failed. It simply stopped reading.
#
# On this host that meant the entire journald ingest path died at every
# rotation (~2h at 50MB), and nothing noticed for weeks: the fleet-wide
# freshness check stays green on any single live source, and the coverage
# check only proves a source directory exists.
#
# So journald forwards each message to the standard syslog socket as it
# arrives (ForwardToSyslog=yes) and imuxsock reads that socket. No cursor to
# lose, no file to follow across a rotation. This is the pre-systemd syslog
# path, and it is boring on purpose.
#############################################################################

global(workDirectory="/var/lib/rsyslog")

# Receives journald's forward on /run/systemd/journal/syslog, which systemd's
# syslog.socket creates and hands over. Deliberately the only input module.
module(load="imuxsock" SysSock.Use="on")

#############################################################################
# Forward everything to the collector
#
# TARGET: 127.0.0.1, not syslog.crunchtools.com. That name resolves to
# Cloudflare, which proxies HTTP(S) and will not carry syslog, and the
# collector publishes 514 only on 127.0.0.1 and the podman bridge (10.88.0.1).
# For a second host to ship here, the collector needs 514 on a routable
# interface and an internal DNS record that is not Cloudflare-proxied.
#
# TCP, not UDP: a dropped datagram is silent, and silent loss is the entire
# reason this change exists.
#
# ATTRIBUTION: the collector files a message under a source directory. For
# traffic from this forwarder it uses the TAG, because the hostname is this
# machine. conmon sets SYSLOG_IDENTIFIER to the container name, so the tag is
# the container name for containers and the unit name for host services --
# which is exactly the layout the collector already had under imjournal. The
# matching rule lives in the collector's own rsyslog.conf.
#
# The disk-assisted queue is the point of the exercise: if the collector is
# down, restarting, or being redeployed, messages spool to disk and drain when
# it returns rather than evaporating. saveOnShutdown carries the spool across
# a host reboot.
#############################################################################
*.* action(type="omfwd"
           target="127.0.0.1"
           port="514"
           protocol="tcp"
           template="RSYSLOG_SyslogProtocol23Format"
           action.resumeRetryCount="-1"
           action.resumeInterval="10"
           queue.type="linkedList"
           queue.filename="fwd_collector"
           queue.spoolDirectory="/var/lib/rsyslog"
           queue.maxDiskSpace="500m"
           queue.saveOnShutdown="on")
