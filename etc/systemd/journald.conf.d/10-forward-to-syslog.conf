# Hand every message to the syslog socket as it arrives, so rsyslog never has
# to read journald's binary files. Reading them with imjournal is what silently
# died at each journal rotation; see /etc/rsyslog.conf.
#
# This is additive. Storage stays persistent (see size-limit.conf), so the
# journal remains the local buffer and `podman logs` keeps working -- which the
# fleet relies on, and which the per-source Nagios check uses as its
# independent witness that a container really did emit a line.
[Journal]
ForwardToSyslog=yes

# Set explicitly rather than inherited. journald rate-limits what it ACCEPTS,
# before anything is forwarded, so a burst is dropped at the door rather than
# in transit. The stock default is 10000/30s per service; this raises the
# ceiling for chatty containers while still bounding a runaway.
RateLimitIntervalSec=30s
RateLimitBurst=20000
