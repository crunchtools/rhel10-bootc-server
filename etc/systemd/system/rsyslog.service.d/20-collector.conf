# Where the forwarder ships logs. rsyslog.conf reads RSYSLOG_COLLECTOR with a
# backtick `echo`, because an omfwd target cannot otherwise come from outside
# the config. The default is gloval's: the collector runs there on 127.0.0.1.
# Any other host sets it in /etc/sysconfig/rsyslog-collector, e.g.
#   RSYSLOG_COLLECTOR=10.44.0.1      (gloval's WireGuard address)
# EnvironmentFile= overrides Environment=, and bootc's /etc merge keeps the
# host's file across image updates.
#
# Not a file read with `cat`: rsyslog keeps the file's trailing newline as a
# space and the target then fails to resolve -- found by test, invisible to
# rsyslogd -N1.
[Service]
Environment=RSYSLOG_COLLECTOR=127.0.0.1
EnvironmentFile=-/etc/sysconfig/rsyslog-collector
