# syslog.socket is a static unit with no [Install] section: it owns
# /run/systemd/journal/syslog, the socket journald forwards to. Enabling
# rsyslog alone relies on the Alias=syslog.service indirection to pull it in.
# Make the dependency explicit so the socket is guaranteed to exist before
# rsyslog starts -- without it, ForwardToSyslog has nowhere to write and logs
# are lost silently, which is the failure mode this whole change removes.
[Unit]
Wants=syslog.socket
After=syslog.socket
