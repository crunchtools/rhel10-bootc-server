# RT #1594. This unit is `bootc upgrade --apply`, and --apply reboots the host
# itself -- it hands `systemctl reboot` to systemd-run roughly twenty seconds
# after staging the image. On 2026-11-08 at 03:30 that landed on the weekly
# pCloud rotation at 93% and SIGKILLed a ten-hour transfer with 36 minutes
# left. Nothing coordinated the two.
#
# The pbs rotations now hold a `--mode=block` shutdown inhibitor for the life
# of the run. logind rejects a strong block inhibitor outright when the caller
# passes no skip flag, root or not, TTY or not (logind-dbus.c: "With a strong
# inhibitor, if the skip flag is not set, reject outright"), and bootc calls
# plain `systemctl reboot`. So the reboot is refused while a rotation is in
# flight. That is the guarantee, and it does not care who started this unit --
# which matters, because the caller is still unidentified: the timer here is
# masked, and the service takes a manual start over D-Bus.
#
# Two consequences this drop-in exists to handle:
#
# TimeoutStartSec. bootc calls systemd-run WITHOUT --wait, so systemd-run
# returns 0 the moment the transient unit starts and never sees systemctl's
# non-zero exit. bootc then parks forever waiting for the SIGTERM that a
# refused reboot never sends. Upstream bug; until it is fixed, bound the wait.
# The 11-08 run pulled, staged and rebooted in 20 seconds, so ten minutes is
# thirty times the headroom and still bounds the hang.
#
# OnFailure. A refused reboot leaves the image staged and nothing retrying,
# which is skipped, not deferred. Arm one retry thirty minutes out. A rotation
# still running refuses again and re-arms; when it finishes, the staged image
# applies. `bootc upgrade --apply` reboots on an unchanged staged deployment
# (cli.rs, the staged_unchanged branch), so the retry does not need to re-fetch
# anything to work.
#
# Why OnFailure= points at a service and not straight at the timer any more
# (RT #1566). Everything above works and leaves wreckage: the timeout that
# bounds bootc's park puts THIS unit in `failed` with Result=timeout, and each
# refused reboot leaves the transient systemd-run made for it -- a
# `run-pNNN-iNNN.service` whose command is `systemctl reboot
# --message=Initiated by bootc` -- failed as well, because `systemctl reboot`
# came back non-zero. One of each per cycle, and they accumulate: four
# transients on 2026-11-09. gloval's "Host failed systemd units" check counted
# them and sat CRITICAL for over two hours while this interlock was doing
# exactly what it was built to do, and the failed units then had to be swept
# by hand.
#
# The consequence is worse than the noise. A check that goes red when nothing
# is wrong gets acknowledged, and an acknowledged check is not a check. So
# this cannot be fixed by teaching the monitor to ignore the units -- the host
# has to stop reporting itself broken when it is not, without getting any
# quieter about the times it is.
#
# bootc-apply-deferred.service is that distinction, and it is the reason for
# the indirection: a plain OnFailure=timer cannot tell a deferral from a
# failure, because it is a dependency and not a decision. The service reads
# this unit's Result, looks for the reboot request's own transient from the
# same run, and then requires logind's denial in this cycle's journal -- the
# difference between a backup holding an update off and a host that cannot
# reboot. Only with all three does it reset-failed this unit and those
# transients, and then arm the timer. On anything else it changes no failed
# state at all and the host stays as loud as it is today. It still arms the
# retry either way, which is what pointing at the timer did before it existed.
#
# The live inhibitor is logged but decides nothing, and that is deliberate.
# TimeoutStartSec is ten minutes, so by the time anything reads it the
# inhibitor is wrong in both directions: gone if the rotation finished inside
# that window, and present if an unrelated rotation merely started after a
# reboot had already failed for its own reasons.
[Unit]
OnFailure=bootc-apply-deferred.service

[Service]
TimeoutStartSec=10min

# Verified on the live host, 2026-11-09 (RT #1594), not only read from source:
#
#   02:19:06  reboot requested by bootc while PersonalBackups-Monthly-1 held
#             the block inhibitor -> "Call to Reboot failed: Access denied".
#             The rotation ran on to a clean finish at 02:31:16.
#   02:34:14  the same unit started again with no rotation in flight -> the
#             staged image applied and the host rebooted at 02:36.
#
# One thing to expect from a SUCCESSFUL apply, so it is not mistaken for a
# failure of this interlock: the reboot bootc asks for tears down this unit,
# so its own process takes the SIGTERM and systemd records
# "Failed with result 'signal'" in the journal of the boot that is ending.
# OnFailure= therefore fires on the way down and tries to arm the retry timer.
# That start job dies with the shutdown and no timer survives the reboot, so
# it is cosmetic -- but a 'signal' failure immediately before a boot is the
# expected shape of success here, not a refused reboot. A refused reboot looks
# different: the journal carries "Access denied" and this unit sits in
# activating until TimeoutStartSec cuts it.
