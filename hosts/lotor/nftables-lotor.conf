# Lotor host firewall: mail only (RT#1638, Nanode since 2026-11-18).
# Inbound is ssh on 22422, SMTP on 25 and ICMP. Does NOT touch netavark's
# table (container networking).

table inet lotor_firewall {
    chain input {
        type filter hook input priority 0; policy accept;

        ct state established,related accept
        iif lo accept

        # The "mail" podman network (postfix at 10.89.1.2, gateway 10.89.1.1)
        # and the default podman bridge.
        ip saddr 10.88.0.0/16 accept
        ip saddr 10.89.1.0/24 accept

        meta l4proto icmp accept
        meta l4proto icmpv6 accept

        tcp dport 22422 accept   # SSH (custom port)
        tcp dport 25 accept      # SMTP (mail.crunchtools.com)

        counter drop
    }
}
